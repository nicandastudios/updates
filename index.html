<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nicanda Studios – Updates</title>
<style>
:root { color-scheme: light dark; --grund: #f7f4ee; --text: #24211c; --leise: #6b6459;
  --linie: #ddd6ca; --akzent: #8a5a2b; }
@media (prefers-color-scheme: dark) {
  :root { --grund: #1c1a17; --text: #ece7de; --leise: #a59d90; --linie: #3a362f; --akzent: #d6a46c; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--grund); color: var(--text);
  font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
main, footer { max-width: 42rem; margin: 0 auto; padding: 0 1rem; }
main { padding-top: 2.5rem; padding-bottom: 2rem; }
h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 .75rem; }
h2 { font-size: 1.15rem; margin: 0 0 .25rem; }
h3 { font-size: 1rem; margin: .9rem 0 .2rem; }
p { margin: 0 0 1rem; }
a { color: var(--akzent); }
.leise { color: var(--leise); font-weight: normal; }
ol.versionen { list-style: none; margin: 1.5rem 0 0; padding: 0; }
ol.versionen > li { border-top: 1px solid var(--linie); padding: 1rem 0; }
ul { margin: .2rem 0 .4rem; padding-left: 1.2rem; }
ul li { margin: .35rem 0; }
ol.versionen ul { list-style: disc; }
ol.versionen ul li::marker { color: var(--leise); }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
ol.versionen > li { scroll-margin-top: 1.25rem; }
ol.versionen > li:target h2 { color: var(--akzent); }
.kopf { max-width: 42rem; margin: 0 auto; padding: 2.5rem 1rem 0; }
.kopf + nav.inhalt + main { padding-top: 1rem; }
nav.inhalt { max-width: 42rem; margin: 0 auto; padding: 0 1rem; }
nav.inhalt .inhalt-titel { font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--leise); margin: 0 0 .5rem; }
nav.inhalt ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--linie); }
html { scroll-padding-top: 3.25rem; }
.leiste { position: sticky; top: 0; z-index: 2; display: flex; justify-content: flex-end; background: var(--grund);
  border-bottom: 1px solid var(--linie); padding: 0 1rem; }
.leiste a { display: inline-block; padding: .7rem 0 .7rem 1rem; min-height: 2.75rem; color: var(--akzent);
  text-decoration: none; font-weight: 600; }
#zu { position: fixed; top: 0; }
nav.ueber { display: none; }
nav.ueber:target { display: block; position: fixed; z-index: 3; top: 0; right: 0; bottom: 0; left: 0; max-width: none;
  overflow-y: auto; overscroll-behavior: contain; scroll-padding-top: 4rem; padding: 0 1rem 2rem;
  background: var(--grund); }
nav.ueber .innen { min-height: calc(100% + 1px); }
nav.ueber a.zu { display: block; position: sticky; top: 0; text-align: right; padding: 1.3rem 0 .9rem; color: var(--akzent);
  font-weight: 600; text-decoration: none; background: var(--grund); }
nav.inhalt li { margin: 0; border-bottom: 1px solid var(--linie); }
nav.inhalt a { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: .55rem 0;
  text-decoration: none; color: var(--text); }
nav.inhalt .tag { color: var(--leise); font-variant-numeric: tabular-nums; }
nav.inhalt a:hover .nummer, nav.inhalt a:focus-visible .nummer { color: var(--akzent); text-decoration: underline; }
nav.inhalt a:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }
@media (min-width: 60rem) {
  .seite { display: grid; grid-template-columns: 16rem minmax(0, 42rem); column-gap: 3rem; align-items: start;
    grid-template-areas: "inhalt kopf" "inhalt liste" "inhalt fuss"; }
  .seite > .kopf { grid-area: kopf; margin: 0; padding: 2.5rem 1rem 0 0; }
  .seite > main { grid-area: liste; margin: 0; padding: 1rem 1rem 2rem 0; }
  .seite > footer { grid-area: fuss; margin: 0; padding-left: 0; }
  .seite > nav.inhalt { grid-area: inhalt; position: sticky; top: 0; max-height: 100vh; overflow-y: auto; margin: 0;
    padding: 2.5rem 1.25rem 2rem 1.5rem; min-height: 100vh; max-width: none; border-right: 1px solid var(--linie); }
  html { scroll-padding-top: 0; }
  .leiste, nav.ueber:target { display: none; }
}
@media (max-width: 59.99rem) {
  html:has(nav.ueber:target) { overflow: hidden; }
  nav.ueber:target ~ .leiste, nav.ueber:target ~ .seite { visibility: hidden; }
}
ul.apps { list-style: none; padding: 0; margin: 1.5rem 0 0; }
ul.apps li { border-top: 1px solid var(--linie); padding: .9rem 0; margin: 0; font-size: 1.15rem; }
footer { border-top: 1px solid var(--linie); padding-top: 1rem; padding-bottom: 2rem; font-size: .9rem; }
</style>
</head>
<body>
<main>
<h1>Updates</h1>
<p>Was sich in den Apps von Nicanda Studios geändert hat.</p>
<ul class="apps">
<li><a href="daymory/">Daymory</a></li>
</ul>
</main>
<footer>
<p>Nicanda Studios · <a href="https://legal.nicandastudios.ch/">Rechtliches</a></p>
</footer>
</body>
</html>
